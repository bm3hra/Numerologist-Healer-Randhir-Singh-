<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 950" width="100%" height="100%">
  <defs>
    <linearGradient id="hallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="gownBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="tasselGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Background Warm Curtain Hall -->
  <rect width="700" height="950" fill="url(#hallBg)" />
  <path d="M 0 0 L 220 0 L 220 950 L 0 950 Z" fill="#d97706" opacity="0.25" />
  <path d="M 0 0 L 140 0 L 140 950 L 0 950 Z" fill="#b45309" opacity="0.35" />

  <!-- Master Randhir Singh in Full Graduation Convocation Regalia -->
  <!-- Wide Ceremonial Robe Shoulders -->
  <path d="M 60 950 L 100 500 L 250 420 L 450 420 L 600 500 L 640 950 Z" fill="url(#gownBlack)" />
  <!-- Gown Pleats & Folds -->
  <path d="M 250 420 L 230 950 L 290 950 L 320 520 Z" fill="#27272a" opacity="0.6" />
  <path d="M 450 420 L 470 950 L 410 950 L 380 520 Z" fill="#18181b" opacity="0.6" />

  <!-- Inner Black Suit & Royal Blue Patterned Tie with Gold Tie Clip -->
  <polygon points="310,480 390,480 380,680 320,680" fill="#09090b" />
  <polygon points="330,480 370,480 365,650 335,650" fill="#1d4ed8" />
  <!-- Tie Clip -->
  <rect x="335" y="580" width="30" height="5" fill="#facc15" stroke="#ca8a04" stroke-width="1" />
  <!-- Buttons -->
  <circle cx="350" cy="710" r="5" fill="#71717a" />
  <circle cx="350" cy="800" r="5" fill="#71717a" />

  <!-- Head & Smile -->
  <ellipse cx="350" cy="330" rx="95" ry="115" fill="#fbd38d" />
  <!-- Hair Sides -->
  <path d="M 260 300 Q 250 360 270 380" stroke="#451a03" stroke-width="10" fill="none" />
  <path d="M 440 300 Q 450 360 430 380" stroke="#451a03" stroke-width="10" fill="none" />
  <!-- Eyes -->
  <ellipse cx="315" cy="305" rx="10" ry="6" fill="#000000" />
  <ellipse cx="385" cy="305" rx="10" ry="6" fill="#000000" />
  <!-- Cheerful Smile & Moustache -->
  <path d="M 295 345 Q 350 330 405 345 Q 380 370 350 365 Q 320 370 295 345 Z" fill="#18181b" />
  <path d="M 315 375 Q 350 395 385 375" stroke="#ffffff" stroke-width="3" fill="none" />

  <!-- Academic Mortarboard Cap (Black Diamond) -->
  <polygon points="350,150 560,230 350,300 140,230" fill="#09090b" stroke="#27272a" stroke-width="3" />
  <!-- Cap Skull Base -->
  <path d="M 250 250 Q 350 280 450 250 L 440 280 Q 350 310 260 280 Z" fill="#18181b" />

  <!-- Center Button on Cap -->
  <circle cx="350" cy="225" r="7" fill="#facc15" />

  <!-- Brilliant Golden Yellow Tassel hanging to Left -->
  <path d="M 350 225 Q 260 240 240 280" stroke="#facc15" stroke-width="4" fill="none" />
  <!-- Tassel Fringe Body -->
  <polygon points="230,280 250,280 260,350 220,350" fill="url(#tasselGold)" />
  <line x1="225" y1="350" x2="225" y2="365" stroke="#eab308" stroke-width="3" />
  <line x1="235" y1="350" x2="235" y2="368" stroke="#ca8a04" stroke-width="3" />
  <line x1="245" y1="350" x2="245" y2="366" stroke="#facc15" stroke-width="3" />
  <line x1="255" y1="350" x2="255" y2="363" stroke="#eab308" stroke-width="3" />

  <!-- Badge at bottom -->
  <rect x="120" y="870" width="460" height="50" rx="12" fill="#0f172a" opacity="0.95" stroke="#eab308" stroke-width="2" />
  <text x="350" y="902" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1">
    CONVOCATION GRADUATION · GOLDEN TASSEL
  </text>
</svg>
