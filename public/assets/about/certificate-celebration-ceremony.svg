<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="stageGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
  </defs>

  <!-- Stage Lighting & Backdrop Wall of Scholars -->
  <rect width="1000" height="650" fill="url(#stageGlow)" />
  <!-- Floral Garlands on Left & Right -->
  <g fill="#ea580c">
    <circle cx="40" cy="180" r="14" /><circle cx="65" cy="220" r="16" /><circle cx="35" cy="270" r="15" /><circle cx="55" cy="320" r="14" />
    <circle cx="960" cy="180" r="14" /><circle cx="935" cy="220" r="16" /><circle cx="965" cy="270" r="15" /><circle cx="945" cy="320" r="14" />
  </g>
  <g fill="#facc15">
    <circle cx="50" cy="150" r="10" /><circle cx="45" cy="245" r="11" /><circle cx="70" cy="290" r="10" />
    <circle cx="950" cy="150" r="10" /><circle cx="955" cy="245" r="11" /><circle cx="930" cy="290" r="10" />
  </g>

  <!-- Stage Backdrop Wall with Numerology Dial 0-9 & Portraits -->
  <g fill="#f8fafc" opacity="0.9">
    <rect x="120" y="40" width="760" height="320" rx="12" />
    <!-- Clock Dial Numbers 0 to 9 in background -->
    <text x="500" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="70" font-weight="900" fill="#e2e8f0" text-anchor="middle" letter-spacing="16">
      0 1 3 4 5 6 7 8 9
    </text>
  </g>

  <!-- Dignitaries on Stage: -->
  <!-- 1. Achiever in Green Suit on Left holding Certificate -->
  <path d="M 120 650 L 160 360 L 320 320 L 440 360 L 460 650 Z" fill="#14532d" />
  <ellipse cx="280" cy="220" rx="60" ry="75" fill="#fbd38d" />
  <circle cx="260" cy="210" r="5" fill="#000000" /><circle cx="300" cy="210" r="5" fill="#000000" />
  <path d="M 265 245 Q 280 260 295 245" stroke="#991b1b" stroke-width="2.5" fill="none" />
  <rect x="245" y="200" width="70" height="20" rx="3" fill="none" stroke="#334155" stroke-width="2" />

  <!-- 2. Mentor in Center Background -->
  <ellipse cx="450" cy="280" rx="50" ry="65" fill="#fbd38d" />
  <circle cx="435" cy="275" r="4" fill="#000000" /><circle cx="465" cy="275" r="4" fill="#000000" />
  <path d="M 400 340 L 500 340 L 520 650 L 380 650 Z" fill="#1e1b4b" />

  <!-- 3. Master Randhir Singh on Right (Presenting Certificate) -->
  <path d="M 540 650 L 590 350 L 760 320 L 900 360 L 920 650 Z" fill="#0f172a" />
  <!-- Lapel Badge -->
  <rect x="680" y="440" width="30" height="15" rx="2" fill="#d97706" />
  <!-- Purple Floral Tie & White Shirt -->
  <polygon points="690,360 730,360 720,480 700,480" fill="#ffffff" />
  <polygon points="702,380 718,380 714,470 706,470" fill="#581c87" />

  <!-- Master Randhir Singh Head & Smile -->
  <ellipse cx="740" cy="225" rx="65" ry="80" fill="#fbd38d" />
  <path d="M 680 195 Q 740 120 800 195 Q 785 140 740 130 Q 695 140 680 195 Z" fill="#451a03" />
  <circle cx="715" cy="215" r="5" fill="#000000" /><circle cx="765" cy="215" r="5" fill="#000000" />
  <!-- Moustache & Smile -->
  <path d="M 700 250 Q 740 235 780 250 Q 760 270 740 265 Q 720 270 700 250 Z" fill="#18181b" />
  <path d="M 720 270 Q 740 285 760 270" stroke="#ffffff" stroke-width="2.5" fill="none" />

  <!-- The Framed Certificate Held Between Them -->
  <rect x="310" y="360" width="280" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="8" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.4))" />
  <rect x="325" y="375" width="250" height="170" fill="#fffbeb" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 3" />
  <text x="450" y="415" font-family="'Cinzel', serif" font-size="16" font-weight="900" fill="#991b1b" text-anchor="middle">Certificate of Completion</text>
  <text x="450" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">This is to certify that</text>
  <text x="450" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">has successfully completed the program</text>
  <!-- Seal -->
  <circle cx="450" cy="505" r="12" fill="#d97706" />

  <!-- Blue Stage Spotlights at Bottom -->
  <circle cx="100" cy="620" r="18" fill="#38bdf8" opacity="0.8" />
  <circle cx="900" cy="620" r="18" fill="#38bdf8" opacity="0.8" />

  <!-- Bottom Title Bar -->
  <rect x="250" y="585" width="500" height="45" rx="10" fill="#0f172a" opacity="0.95" stroke="#f59e0b" stroke-width="2" />
  <text x="500" y="613" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#fde68a" text-anchor="middle" letter-spacing="1">
    CERTIFICATE CELEBRATION CEREMONY ON STAGE
  </text>
</svg>
