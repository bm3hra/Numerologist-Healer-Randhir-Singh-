<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 950" width="100%" height="100%">
  <defs>
    <linearGradient id="grandHall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="woodPlaque" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="goldPlateYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Grand Ballroom Setting with Golden Yellow Drapery -->
  <rect width="700" height="950" fill="url(#grandHall)" />
  <path d="M 0 0 L 200 0 L 200 950 L 0 950 Z" fill="#d97706" opacity="0.3" />

  <!-- Master Randhir Singh in Gown & Cap -->
  <path d="M 50 950 L 100 480 L 240 400 L 460 400 L 600 480 L 650 950 Z" fill="#09090b" />
  
  <!-- Suit & Blue Tie -->
  <polygon points="310,460 390,460 380,680 320,680" fill="#18181b" />
  <polygon points="335,460 365,460 360,650 340,650" fill="#2563eb" />

  <!-- Head, Cap & Golden Tassel -->
  <ellipse cx="350" cy="310" rx="95" ry="115" fill="#fbd38d" />
  <polygon points="350,140 550,215 350,280 150,215" fill="#09090b" stroke="#27272a" stroke-width="2" />
  <circle cx="350" cy="215" r="6" fill="#facc15" />
  <!-- Yellow Tassel -->
  <path d="M 350 215 Q 260 220 230 260" stroke="#facc15" stroke-width="4" fill="none" />
  <rect x="215" y="260" width="30" height="60" rx="3" fill="#eab308" />

  <!-- Smiling Face & Moustache -->
  <ellipse cx="315" cy="295" rx="8" ry="5" fill="#000000" />
  <ellipse cx="385" cy="295" rx="8" ry="5" fill="#000000" />
  <path d="M 300 330 Q 350 315 400 330 Q 380 355 350 350 Q 320 355 300 330 Z" fill="#18181b" />
  <path d="M 320 355 Q 350 375 380 355" stroke="#ffffff" stroke-width="2.5" fill="none" />

  <!-- ITEM 1: FRAMED CERTIFICATE OF COMPLETION (Held in Left Hand / Viewer's Left) -->
  <g transform="rotate(-6 180 550)">
    <!-- White Bevel Frame -->
    <rect x="15" y="320" width="310" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="6" />
    <rect x="25" y="330" width="290" height="210" fill="#fffbeb" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="8 4" />
    <!-- Header -->
    <text x="170" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#475569" text-anchor="middle">ROYAL SKILLS ACADEMY · Regd. No. 10115</text>
    <text x="170" y="375" font-family="'Cinzel', serif" font-size="16" font-weight="900" fill="#991b1b" text-anchor="middle">Certificate of Completion</text>
    <text x="170" y="395" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">This is to certify that</text>
    <text x="170" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">Mr. Randhir Singh</text>
    <text x="170" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">has undergone the Advance Numerology Course</text>
    <text x="170" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">from Royal Skills Academy successfully.</text>
    <!-- Seal & Signatures -->
    <circle cx="170" cy="495" r="14" fill="#dc2626" opacity="0.8" />
    <text x="70" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" fill="#0f172a">Academic Director</text>
    <text x="235" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" fill="#0f172a">Dr. Rohit Sachdev</text>
  </g>

  <!-- ITEM 2: WOODEN 3-GOLD-STAR TROPHY PLAQUE (Held in Right Hand / Viewer's Right) -->
  <g transform="rotate(4 530 550)">
    <!-- Wooden Plaque Body -->
    <path d="M 400 350 L 640 375 L 635 620 L 390 595 Z" fill="url(#woodPlaque)" stroke="#27272a" stroke-width="4" rx="10" />
    <!-- Yellow Golden Inscription Plate -->
    <polygon points="415,370 625,392 620,595 408,575" fill="url(#goldPlateYellow)" stroke="#b45309" stroke-width="2" />
    <!-- 3 Golden Stars on Right side of Plaque -->
    <text x="590" y="430" font-size="24" fill="#fef08a" stroke="#ca8a04">★</text>
    <text x="590" y="470" font-size="28" fill="#fef08a" stroke="#ca8a04">★</text>
    <text x="590" y="510" font-size="24" fill="#fef08a" stroke="#ca8a04">★</text>
    <!-- Text on Trophy -->
    <text x="500" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle">CONGRATULATIONS</text>
    <text x="500" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">Randhir Singh</text>
    <text x="500" y="454" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="bold" fill="#451a03" text-anchor="middle">On Successful Completion of</text>
    <text x="500" y="478" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#991b1b" text-anchor="middle">Advance Numerology Course</text>
    <text x="500" y="498" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#1f2937" text-anchor="middle">By Dr. ROHIT SACHDEV</text>
    <text x="500" y="512" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#475569" text-anchor="middle">(Numerologist &amp; Vastu Consultant)</text>
    <text x="500" y="535" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#7c2d12" text-anchor="middle">11th JUNE 2024</text>
    <text x="500" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Navgal Saikk Academy, New Delhi</text>
  </g>

  <!-- Bottom Milestone Banner -->
  <rect x="80" y="870" width="540" height="52" rx="12" fill="#0f172a" opacity="0.95" stroke="#f59e0b" stroke-width="2" />
  <text x="350" y="902" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#fde68a" text-anchor="middle" letter-spacing="1">
    PROUD CONVOCATION ACHIEVEMENT · NEW DELHI
  </text>
</svg>
