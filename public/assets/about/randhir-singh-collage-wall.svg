<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="100%" height="100%">
  <defs>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="suitBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueTie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background Gallery Wall with Numerologist Portraits -->
  <rect width="700" height="900" fill="url(#wallBg)" />
  
  <!-- Tree of Knowledge graphic in background wall -->
  <path d="M 100 800 Q 250 500 200 200 Q 300 350 400 150 Q 350 400 500 300 Q 400 600 350 900 Z" fill="#991b1b" opacity="0.12" />

  <!-- Wall Portraits Grid (Simulated photos of scholars & Randhir Singh) -->
  <g stroke="#cbd5e1" stroke-width="2">
    <rect x="40" y="60" width="85" height="105" rx="4" fill="#94a3b8" />
    <rect x="150" y="40" width="90" height="110" rx="4" fill="#64748b" />
    <rect x="260" y="70" width="85" height="105" rx="4" fill="#94a3b8" />
    <rect x="40" y="190" width="90" height="110" rx="4" fill="#64748b" />
    <rect x="150" y="170" width="90" height="115" rx="4" fill="#475569" />
    
    <!-- Highlighted Photo on the Wall (Randhir Singh featured on the community tree) -->
    <rect x="100" y="440" width="105" height="130" rx="6" fill="#1e3a8a" stroke="#d97706" stroke-width="3" />
    <circle cx="152" cy="490" r="30" fill="#fcd34d" />
    <text x="152" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">RANDHIR SINGH</text>

    <rect x="230" y="420" width="95" height="120" rx="4" fill="#64748b" />
    <rect x="40" y="590" width="90" height="115" rx="4" fill="#94a3b8" />
    <rect x="150" y="720" width="95" height="120" rx="4" fill="#64748b" />
  </g>

  <!-- Master Randhir Singh in Suit (Foreground Right, Presenting Wall) -->
  <!-- Suit Body -->
  <path d="M 230 900 L 290 560 L 460 480 L 700 520 L 700 900 Z" fill="url(#suitBlack)" />
  <!-- Left Lapel & Right Lapel -->
  <polygon points="460,480 430,620 490,690 520,530" fill="#334155" />
  <polygon points="400,620 370,550 460,480 430,620" fill="#1e293b" />
  
  <!-- White Dress Shirt & Patterned Blue Tie -->
  <polygon points="440,480 480,480 470,580 450,580" fill="#ffffff" />
  <polygon points="452,500 468,500 462,640 458,640" fill="url(#blueTie)" stroke="#60a5fa" stroke-width="1" />

  <!-- Extended Arm & Hand Gesturing Toward Wall -->
  <path d="M 290 560 Q 200 590 140 570 Q 115 565 100 575 Q 120 595 160 600 Q 220 615 280 625 Z" fill="#ed8936" stroke="#c05621" stroke-width="2" />

  <!-- Head & Warm Smile -->
  <ellipse cx="510" cy="380" rx="90" ry="105" fill="#fbd38d" />
  <!-- Hair & Moustache -->
  <path d="M 430 350 Q 510 240 590 350 Q 570 270 510 260 Q 440 270 430 350 Z" fill="#451a03" />
  <!-- Eyes -->
  <circle cx="475" cy="355" r="5" fill="#000000" />
  <circle cx="545" cy="355" r="5" fill="#000000" />
  <!-- Cheerful Smile & Moustache -->
  <path d="M 460 405 Q 510 390 560 405 Q 540 425 510 420 Q 480 425 460 405 Z" fill="#1e293b" />
  <path d="M 475 425 Q 510 445 545 425" stroke="#ffffff" stroke-width="3" fill="none" />

  <!-- Title Badge Overlay -->
  <rect x="20" y="830" width="380" height="50" rx="10" fill="#0f172a" opacity="0.9" stroke="#d97706" stroke-width="2" />
  <text x="210" y="862" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#fde68a" text-anchor="middle">
    COMMUNITY WALL OF NUMEROLOGISTS
  </text>
</svg>
