<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 950" width="100%" height="100%">
  <defs>
    <linearGradient id="podiumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="woodPodium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="curtainSparkles" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Stage Background with Blue Twinkling Crystal Curtains -->
  <rect width="700" height="950" fill="url(#podiumBg)" />
  <!-- Sparkle light strands on right -->
  <rect x="520" y="0" width="180" height="950" fill="url(#curtainSparkles)" opacity="0.6" />
  <g fill="#a5f3fc" opacity="0.8">
    <circle cx="550" cy="100" r="3" /><circle cx="580" cy="180" r="2.5" /><circle cx="620" cy="250" r="3" /><circle cx="660" cy="320" r="2" />
    <circle cx="540" cy="400" r="2.5" /><circle cx="590" cy="480" r="3" /><circle cx="630" cy="560" r="2" /><circle cx="670" cy="650" r="3" />
  </g>

  <!-- Backdrop Banner: "NUMBER OF NUMEROLOGISTS TO EXPLORE THE WORLD" -->
  <rect x="0" y="0" width="500" height="420" fill="#f8fafc" opacity="0.9" />
  <text x="250" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#14532d" text-anchor="middle">
    NUMBER OF NUMEROLOGISTS
  </text>
  <text x="250" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#9a3412" text-anchor="middle">
    TO EXPLORE THE WORLD
  </text>

  <!-- Master Randhir Singh Behind Podium Speaking -->
  <!-- Suit Shoulders & Body -->
  <path d="M 120 700 L 150 360 L 250 290 L 390 290 L 490 360 L 520 700 Z" fill="#0f172a" />
  <!-- Lapels -->
  <polygon points="250,290 230,450 300,520 320,360" fill="#1e293b" />
  <polygon points="390,290 410,450 340,520 320,360" fill="#334155" />
  <!-- Golden Name Badge on Lapel: "Randhir Singh" -->
  <rect x="365" y="340" width="60" height="18" rx="3" fill="#d97706" stroke="#fef08a" stroke-width="1" />
  <text x="395" y="353" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Randhir Singh</text>

  <!-- Shirt & Blue Silk Tie -->
  <polygon points="300,290 340,290 330,480 310,480" fill="#ffffff" />
  <polygon points="312,320 328,320 325,470 315,470" fill="#1d4ed8" />

  <!-- Head, Expressive Face & Moustache -->
  <ellipse cx="320" cy="220" rx="85" ry="100" fill="#fbd38d" />
  <path d="M 245 190 Q 320 100 395 190 Q 380 120 320 110 Q 260 120 245 190 Z" fill="#451a03" />
  <!-- Eyes Looking Forward -->
  <circle cx="290" cy="195" r="5" fill="#000000" />
  <circle cx="350" cy="195" r="5" fill="#000000" />
  <!-- Warm Smiling Mouth & Signature Moustache -->
  <path d="M 270 235 Q 320 220 370 235 Q 350 255 320 250 Q 290 255 270 235 Z" fill="#1e293b" />
  <path d="M 290 255 Q 320 275 350 255" stroke="#ffffff" stroke-width="2.5" fill="none" />

  <!-- Microphone on Stand in Front of Mouth -->
  <path d="M 240 400 Q 260 250 295 240" stroke="#94a3b8" stroke-width="4" fill="none" />
  <ellipse cx="300" cy="240" rx="8" ry="12" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Official Speech Podium -->
  <path d="M 10 950 L 30 460 L 400 460 L 420 950 Z" fill="url(#woodPodium)" stroke="#27272a" stroke-width="4" />
  <!-- Podium Slanted Top -->
  <polygon points="15,460 30,420 410,420 395,460" fill="#78350f" />

  <!-- Podium Front White Banner: "2nd MEGA CONVOCATION - 8th June 2024 - RADISSON BLU NEW DELHI" -->
  <rect x="50" y="475" width="330" height="420" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="215" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#065f46" text-anchor="middle">
    2nd MEGA
  </text>
  <text x="215" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#065f46" text-anchor="middle">
    CONVOCATION
  </text>

  <!-- Tree Emblem on Banner -->
  <circle cx="215" cy="625" r="45" fill="#fef08a" stroke="#d97706" stroke-width="2" />
  <path d="M 215 590 Q 185 620 215 650 Q 245 620 215 590 Z" fill="#047857" />

  <text x="215" y="720" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#14532d" text-anchor="middle">
    8th June 2024
  </text>
  <text x="215" y="755" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#14532d" text-anchor="middle">
    RADISSON BLU
  </text>
  <text x="215" y="790" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#14532d" text-anchor="middle">
    NEW DELHI
  </text>

  <!-- Podium Base Label -->
  <rect x="60" y="905" width="310" height="34" rx="6" fill="#0f172a" />
  <text x="215" y="928" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#fef08a" text-anchor="middle">
    RADISSON BLU CONVOCATION ADDRESS
  </text>
</svg>
