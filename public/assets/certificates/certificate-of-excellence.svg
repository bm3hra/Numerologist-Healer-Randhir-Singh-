<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="innerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>
  </defs>

  <!-- Base Paper -->
  <rect x="0" y="0" width="1200" height="850" fill="#ffffff" />
  
  <!-- Outer Gold Guilloché Border -->
  <rect x="30" y="30" width="1140" height="790" fill="url(#innerBg)" stroke="url(#goldBorderGrad)" stroke-width="6" rx="10" />
  <rect x="44" y="44" width="1112" height="762" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,4" rx="6" />
  <rect x="52" y="52" width="1096" height="746" fill="none" stroke="#b45309" stroke-width="1" rx="4" />

  <!-- Corner Ornamental Leaf Filigree -->
  <g fill="#d97706" opacity="0.9">
    <!-- Top-Left -->
    <path d="M 60 60 C 90 60 120 70 140 90 C 110 90 80 80 60 60 Z" />
    <path d="M 60 60 C 60 90 70 120 90 140 C 90 110 80 80 60 60 Z" />
    <!-- Top-Right -->
    <path d="M 1140 60 C 1110 60 1080 70 1060 90 C 1090 90 1120 80 1140 60 Z" />
    <path d="M 1140 60 C 1140 90 1130 120 1110 140 C 1110 110 1120 80 1140 60 Z" />
    <!-- Bottom-Left -->
    <path d="M 60 790 C 90 790 120 780 140 760 C 110 760 80 770 60 790 Z" />
    <path d="M 60 790 C 60 760 70 730 90 710 C 90 740 80 770 60 790 Z" />
    <!-- Bottom-Right -->
    <path d="M 1140 790 C 1110 790 1080 780 1060 760 C 1090 760 1120 770 1140 790 Z" />
    <path d="M 1140 790 C 1140 760 1130 730 1110 710 C 1110 740 1120 770 1140 790 Z" />
  </g>

  <!-- Top Emblems & Logos -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Center Emblem -->
    <circle cx="0" cy="0" r="38" fill="url(#goldBorderGrad)" stroke="#78350f" stroke-width="2" />
    <circle cx="0" cy="0" r="32" fill="#fffbeb" />
    <circle cx="0" cy="0" r="14" fill="#d97706" />
    <path d="M0 -24 L4 -8 L20 -8 L8 2 L12 18 L0 8 L-12 18 L-8 2 L-20 -8 L-4 -8 Z" fill="#b45309" />
    
    <!-- Title -->
    <text y="78" font-family="'Cinzel', Georgia, serif" font-size="46" font-weight="800" fill="#78350f" letter-spacing="4">
      CERTIFICATE OF EXCELLENCE
    </text>
  </g>

  <!-- Certificate Body Copy -->
  <g transform="translate(600, 315)" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <text y="0" font-size="18" fill="#78716c" font-style="italic">
      This honor is bestowed in recognition of
    </text>
    
    <!-- Big Callout -->
    <text y="50" font-family="'Cinzel', Georgia, serif" font-size="32" font-weight="700" fill="#1c1917">
      OUTSTANDING PERFORMANCE &amp; DEDICATION
    </text>
    <line x1="-300" y1="72" x2="300" y2="72" stroke="url(#goldBorderGrad)" stroke-width="2" />
    
    <text y="115" font-size="20" fill="#44403c">
      In recognition of your outstanding performance, dedication
    </text>
    <text y="145" font-size="20" fill="#44403c">
      and valuable contribution to the success of our organization.
    </text>

    <text y="195" font-size="16" fill="#78716c">
      Conferred at the 2nd Mega Convocation of Certified Numerologists &amp; Healers
    </text>
    <text y="222" font-size="16" font-weight="600" fill="#92400e">
      Venue: Radisson Blu · 16th June 2024
    </text>
  </g>

  <!-- Golden Center Seal -->
  <g transform="translate(600, 620)">
    <circle cx="0" cy="0" r="44" fill="url(#goldBorderGrad)" />
    <circle cx="0" cy="0" r="36" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <text y="5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="10" font-weight="900" fill="#78350f" letter-spacing="1">
      EXCELLENCE
    </text>
  </g>

  <!-- Signatures -->
  <g transform="translate(250, 700)">
    <path d="M 0 0 Q 30 -20 60 -5 T 130 -15" fill="none" stroke="#1c1917" stroke-width="2.5" />
    <line x1="-20" y1="15" x2="160" y2="15" stroke="#78350f" stroke-width="1.5" />
    <text x="70" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="15" font-weight="700" fill="#1c1917">Director</text>
    <text x="70" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="12" fill="#78716c">National Numerology Council</text>
  </g>

  <g transform="translate(950, 700)">
    <path d="M -70 -10 Q -35 -30 0 -10 T 60 -20" fill="none" stroke="#1c1917" stroke-width="2.5" />
    <line x1="-90" y1="15" x2="90" y2="15" stroke="#78350f" stroke-width="1.5" />
    <text x="0" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="15" font-weight="700" fill="#1c1917">Randhir Singh</text>
    <text x="0" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="12" fill="#78716c">Chairman &amp; Master Numerologist</text>
  </g>
</svg>
