    <rect x="-30" y="-35" width="220" height="38" fill="#e2e8f0" opacity="0.6"/>
    <path d="M -15 -12 C 15 -35 30 -5 55 -30 C 80 -55 105 5 130 -20 C 150 -35 170 -15 195 -25" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/>
    <text x="75" y="25" font-family="'Cinzel', Georgia, serif" font-size="21" font-weight="bold" fill="#0f172a" text-anchor="middle">DR. ROHIT GADKARI</text>
    <text x="75" y="50" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">(Ace Numerologer</text>
    <text x="75" y="72" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">PHD Gold Medalist)</text>
