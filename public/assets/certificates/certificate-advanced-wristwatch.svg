  <!-- Registration Number & Date (Bottom Left) -->
  <g transform="translate(130, 700)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">REG NO: A-H 44</text>
    <text x="0" y="30" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Date: 24 NOV 2024</text>
