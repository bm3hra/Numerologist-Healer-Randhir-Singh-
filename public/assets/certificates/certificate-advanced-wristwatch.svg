    <path d="M 1135 735 C 1090 725 1055 705 1040 660 C 1055 670 1085 690 1115 695 C 1125 665 1135 645 1135 620 C 1138 660 1140 700 1135 735 Z"/>
    <circle cx="1085" cy="685" r="5" fill="#d97706"/>
  </g>

  <!-- Top Metadata -->
  <text x="210" y="115" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="bold" fill="#0f172a" letter-spacing="1">UDYAM-GJ-22-0158332</text>
  <text x="960" y="115" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="bold" fill="#0f172a" letter-spacing="1" text-anchor="end">ISO-9001:2015</text>

  <!-- Sacred Lord Ganesha Artwork Emblem (Top Right) -->
  <g transform="translate(930, 160) scale(0.95)">
    <!-- Ganesha Mukut & Face Line Art -->
    <path d="M 50 15 C 30 20 20 45 28 70 C 35 88 52 105 65 125 C 72 135 75 145 70 155 C 60 168 40 160 32 140" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 52 35 Q 75 40 85 65 Q 92 85 85 105" fill="none" stroke="#0f172a" stroke-width="3.5"/>
    <circle cx="55" cy="45" r="4.5" fill="#d97706"/>
    <path d="M 45 60 Q 55 65 65 60" fill="none" stroke="#0f172a" stroke-width="3"/>
  </g>

