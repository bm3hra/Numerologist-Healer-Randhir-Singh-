    <path d="M 65 65 C 110 75 145 95 160 140 C 145 130 115 110 85 105 C 75 135 65 155 65 180 C 62 140 60 100 65 65 Z"/>
    <circle cx="115" cy="115" r="5" fill="#d97706"/>
    <!-- Top-Right Corner Scroll -->
    <path d="M 1135 65 C 1090 75 1055 95 1040 140 C 1055 130 1085 110 1115 105 C 1125 135 1135 155 1135 180 C 1138 140 1140 100 1135 65 Z"/>
    <circle cx="1085" cy="115" r="5" fill="#d97706"/>
    <!-- Bottom-Left Corner Scroll -->
    <path d="M 65 735 C 110 725 145 705 160 660 C 145 670 115 690 85 695 C 75 665 65 645 65 620 C 62 660 60 700 65 735 Z"/>
    <circle cx="115" cy="685" r="5" fill="#d97706"/>
