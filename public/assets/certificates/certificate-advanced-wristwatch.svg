  <line x1="310" y1="425" x2="890" y2="425" stroke="#0f172a" stroke-width="2"/>

  <!-- Course Congratulation Lines -->
  <text x="600" y="495" font-family="'Plus Jakarta Sans', Georgia, sans-serif" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle">
