<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect x="0" y="0" width="1200" height="850" fill="#f1f5f9"/>
  <rect x="25" y="25" width="1150" height="800" fill="url(#bgLight4)" stroke="#0f766e" stroke-width="2.5" rx="6"/>

  <!-- Top-Left Teal Geometric Polygon Accents -->
  <path d="M 25 25 L 380 25 L 300 280 L 25 150 Z" fill="#14b8a6" opacity="0.45"/>
  <path d="M 25 25 L 280 25 L 250 180 L 25 90 Z" fill="#0f766e" opacity="0.65"/>
  <polygon points="25,25 180,25 25,180" fill="#042f2e" opacity="0.8"/>

  <!-- Bottom-Left Deep Teal Polygon Accents -->
  <polygon points="25,500 240,650 25,825" fill="#0f766e"/>
  <polygon points="25,600 170,720 25,825" fill="#042f2e"/>

  <!-- Bottom-Right Teal Geometric Polygon Accents -->
  <polygon points="1175,550 950,825 1175,825" fill="#14b8a6" opacity="0.5"/>
  <polygon points="1175,640 1020,825 1175,825" fill="#0f766e" opacity="0.75"/>

  <!-- Central Subtle Globe Watermark Grid -->
  <g transform="translate(600, 420)" stroke="#94a3b8" stroke-width="1.2" fill="none" opacity="0.25">
    <circle cx="0" cy="0" r="190"/>
    <ellipse cx="0" cy="0" rx="190" ry="85"/>
    <ellipse cx="0" cy="0" rx="85" ry="190"/>
    <line x1="-190" y1="0" x2="190" y2="0"/>
    <line x1="0" y1="-190" x2="0" y2="190"/>
    <ellipse cx="0" cy="0" rx="140" ry="190"/>
  </g>

  <!-- Top Metadata Bar -->
  <text x="60" y="88" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="23" font-weight="900" fill="#042f2e" letter-spacing="1.5">
    UDYAM-GJ-22-0158332
  </text>
  <text x="1100" y="88" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="23" font-weight="900" fill="#042f2e" letter-spacing="1.5" text-anchor="end">
    ISO-9001: 2015
  </text>

  <!-- Main Certificate Title -->
  <text x="600" y="180" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="56" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">
    Certificate
  </text>

  <!-- Acknowledge and Honor -->
  <text x="600" y="235" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="3">
    THIS IS TO ACKNOWLEDGE AND HONOR
  </text>

  <!-- Recipient Name -->
  <text x="600" y="325" font-family="'Cinzel', Georgia, serif" font-size="50" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="5">
    RANDHIR SINGH
  </text>
  <line x1="280" y1="345" x2="920" y2="345" stroke="#1e293b" stroke-width="2"/>

  <!-- Congratulations Body Text -->
  <text x="600" y="420" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">
    Congratulations for Successfully Completing the
  </text>
  <text x="600" y="470" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="800" fill="#0f766e" text-anchor="middle" letter-spacing="1">
    Advance placement Course.
  </text>

  <!-- Central Star Rosette Ribbon Badge -->
  <g transform="translate(600, 620)">
    <!-- Rosette Ribbons -->
    <polygon points="-25,30 -40,110 -15,90 0,110 -10,30" fill="#0f766e"/>
    <polygon points="25,30 40,110 15,90 0,110 10,30" fill="#0f766e"/>
    <!-- Outer Ruffled Rosette Ring -->
    <circle cx="0" cy="15" r="48" fill="#042f2e" stroke="#14b8a6" stroke-width="3"/>
    <circle cx="0" cy="15" r="40" fill="#0f766e"/>
    <!-- 5-Point Center Star -->
    <path d="M 0 -8 L 6 9 L 24 9 L 10 20 L 15 37 L 0 27 L -15 37 L -10 20 L -24 9 L -6 9 Z" fill="#ffffff"/>
  </g>

  <!-- Registration Number & Date (Bottom Left) -->
  <g transform="translate(230, 690)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="21" font-weight="900" fill="#0f172a">REG NO: A-G 62</text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="21" font-weight="900" fill="#0f172a">Date: 23 NOV 2024</text>
  </g>

  <!-- Signature Box & Details (Bottom Right) -->
  <g transform="translate(820, 650)">
    <!-- Signature Line Art -->
    <path d="M 10 5 C 35 -20 50 15 80 -15 C 105 -45 130 15 160 -10 C 180 -25 200 -5 220 -15" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="250" y2="20" stroke="#0f172a" stroke-width="1.5"/>
    <text x="125" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">DR. ROHIT GADKARI</text>
    <text x="125" y="78" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">(Ace Numerologer, PHD Gold</text>
    <text x="125" y="100" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Medalist)</text>
  </g>
