<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="crestSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="treeGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="800" rx="40" fill="#0c1910" />
  <circle cx="400" cy="400" r="360" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="12,6" />
  <circle cx="400" cy="400" r="340" fill="#132a1c" stroke="#10b981" stroke-width="2" />
  <circle cx="400" cy="380" r="260" fill="url(#auraGlow)" />

  <!-- Outer Text Arch -->
  <path id="archTop" d="M 120 400 A 280 280 0 0 1 680 400" fill="none" />
  <text font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="900" fill="#fbbf24" letter-spacing="4">
    <textPath href="#archTop" startOffset="50%" text-anchor="middle">
      2nd MEGA CONVOCATION · 16th JUNE 2024
    </textPath>
  </text>

  <!-- Sun Disc -->
  <circle cx="400" cy="360" r="150" fill="url(#crestSun)" stroke="#d97706" stroke-width="4" />

  <!-- Tree of Life Foliage & Yogi Figure -->
  <!-- Tree Crown -->
  <g fill="url(#treeGreen)">
    <circle cx="400" cy="270" r="55" />
    <circle cx="350" cy="290" r="45" />
    <circle cx="450" cy="290" r="45" />
    <circle cx="320" cy="330" r="35" />
    <circle cx="480" cy="330" r="35" />
    <circle cx="370" cy="235" r="35" />
    <circle cx="430" cy="235" r="35" />
  </g>

  <!-- Golden Leaves Accents -->
  <g fill="#fef08a">
    <circle cx="370" cy="260" r="8" />
    <circle cx="430" cy="260" r="8" />
    <circle cx="400" cy="230" r="9" />
    <circle cx="340" cy="300" r="7" />
    <circle cx="460" cy="300" r="7" />
  </g>

  <!-- Meditating Yogi in Lotus Pose in Center Trunk -->
  <g fill="#e11d48" stroke="#be123c" stroke-width="1.5">
    <!-- Head with Chakra -->
    <circle cx="400" cy="340" r="14" fill="#fbbf24" />
    <!-- Torso -->
    <path d="M 390 355 L 410 355 L 418 395 L 382 395 Z" fill="#e11d48" />
    <!-- Crossed Legs / Lotus Base -->
    <path d="M 360 410 C 375 390 425 390 440 410 C 430 425 370 425 360 410 Z" fill="#be123c" />
    <!-- Arms in Anjali/Dhyana Mudra -->
    <path d="M 386 365 L 370 380 L 385 395 L 400 385 L 415 395 L 430 380 L 414 365" fill="none" stroke="#fbbf24" stroke-width="3" />
  </g>

  <!-- Venue Ribbon Banner -->
  <g transform="translate(400, 560)">
    <rect x="-240" y="-30" width="480" height="60" rx="12" fill="#d97706" stroke="#fbbf24" stroke-width="2" />
    <text y="8" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="3">
      RADISSON BLU
    </text>
  </g>

  <!-- Motto Banner -->
  <text x="400" y="660" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="800" fill="#6ee7b7" letter-spacing="2">
    NUMBER OF NUMEROLOGISTS TO EXPLORE THE WORLD
  </text>
  <text x="400" y="695" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#a7f3d0">
    Keynote Address by Master Randhir Singh · Certified Felicitations
  </text>
</svg>
