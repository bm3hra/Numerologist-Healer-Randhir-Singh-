<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa" />
      <stop offset="100%" stop-color="#faf5ec" />
    </linearGradient>
    <pattern id="sacredPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="#d97706" opacity="0.15" />
    </pattern>
  </defs>

  <!-- Certificate Paper Background -->
  <rect x="0" y="0" width="1200" height="850" fill="#ffffff" />
  <rect x="25" y="25" width="1150" height="800" fill="url(#bgGrad)" stroke="#b45309" stroke-width="4" rx="12" />
  <rect x="35" y="35" width="1130" height="780" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4" rx="8" />
  <rect x="50" y="50" width="1100" height="750" fill="url(#sacredPattern)" rx="6" />

  <!-- Corner Ornaments -->
  <g fill="#b45309">
    <path d="M 45 45 L 95 45 A 50 50 0 0 1 45 95 Z" opacity="0.8" />
    <path d="M 1155 45 L 1105 45 A 50 50 0 0 0 1155 95 Z" opacity="0.8" />
    <path d="M 45 805 L 95 805 A 50 50 0 0 0 45 755 Z" opacity="0.8" />
    <path d="M 1155 805 L 1105 805 A 50 50 0 0 1 1155 755 Z" opacity="0.8" />
  </g>

  <!-- Top Logo & Insignia -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <!-- Emblem -->
    <circle cx="0" cy="0" r="42" fill="#fff" stroke="#b45309" stroke-width="3" />
    <circle cx="0" cy="0" r="36" fill="#fef3c7" />
    <path d="M-15,-10 C-5,-25 5,-25 15,-10 C25,5 15,20 0,25 C-15,20 -25,5 -15,-10 Z" fill="#b45309" />
    <circle cx="0" cy="-5" r="8" fill="#f59e0b" />
    
    <!-- Title -->
    <text y="75" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="800" fill="#78350f" letter-spacing="4">
      CERTIFICATE OF COMPLETION
    </text>
    <text y="105" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#991b1b" letter-spacing="3">
      DEEN DAYAL UPADHYAYA GRAMEEN KAUSHALYA YOJANA (DDU-GKY)
    </text>
  </g>

  <!-- Certificate Body Text -->
  <g transform="translate(600, 310)" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <text y="0" font-size="18" fill="#57534e" font-style="italic">This is proudly certified to</text>
    
    <!-- Recipient Name Holder -->
    <text y="55" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="700" fill="#1c1917" letter-spacing="2">
      HONORED PRACTITIONER &amp; SCHOLAR
    </text>
    <line x1="-320" y1="75" x2="320" y2="75" stroke="#b45309" stroke-width="2" />
    
    <text y="115" font-size="17" fill="#44403c">
      has successfully completed the comprehensive professional course under
    </text>
    <text y="145" font-size="19" font-weight="700" fill="#78350f">
      DDU-GKY Advanced Vedic Sciences &amp; Numerological Studies
    </text>
    <text y="180" font-size="16" fill="#57534e" max-width="800">
      and demonstrated exceptional dedication, sacred ethics, practical skill, and commitment
    </text>
    <text y="208" font-size="16" fill="#57534e">
      towards empowering individuals and building a brighter conscious future.
    </text>
  </g>

  <!-- Gold Rosette Seal in Center Bottom -->
  <g transform="translate(600, 610)">
    <circle cx="0" cy="0" r="48" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
    <circle cx="0" cy="0" r="40" fill="#fffdfa" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,2" />
    <path d="M0 -30 L8 -10 L30 -10 L12 4 L18 25 L0 12 L-18 25 L-12 4 L-30 -10 L-8 -10 Z" fill="#d97706" />
    <text y="4" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="9" font-weight="900" fill="#78350f">
      OFFICIAL SEAL
    </text>
  </g>

  <!-- Signatures -->
  <g transform="translate(240, 690)" text-anchor="center">
    <path d="M 0 0 Q 30 -25 70 -5 T 140 -15" fill="none" stroke="#1c1917" stroke-width="2.5" />
    <line x1="-20" y1="15" x2="180" y2="15" stroke="#78350f" stroke-width="1.5" />
    <text x="80" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="14" font-weight="700" fill="#1c1917">Program Director</text>
    <text x="80" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="12" fill="#78716c">DDU-GKY Conclave</text>
  </g>

  <g transform="translate(960, 690)" text-anchor="center">
    <path d="M -80 -10 Q -40 -35 0 -10 T 60 -25" fill="none" stroke="#1c1917" stroke-width="2.5" />
    <line x1="-100" y1="15" x2="100" y2="15" stroke="#78350f" stroke-width="1.5" />
    <text x="0" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="14" font-weight="700" fill="#1c1917">Master Randhir Singh</text>
    <text x="0" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="12" fill="#78716c">Chairman &amp; Master Healer</text>
  </g>
</svg>
